# MediaMTX (WHIP ingest → LL-HLS) + Caddy (automatic TLS) for the VoxTranslate
# webinar media server. Runs on the Hetzner box — see /DEPLOY-HETZNER.md.
#
# Both use host networking: MediaMTX needs the raw WebRTC UDP range (:8189) and
# Caddy binds :80/:443. MediaMTX's HTTP ports (8888 HLS, 8889 WHIP) stay on
# localhost and are reverse-proxied by Caddy — they are NOT opened in the firewall.
services:
  mediamtx:
    # PINNED (not :latest): an unpinned tag drifts on every `docker compose pull`,
    # which is how a MediaMTX update silently changed HLS behaviour (session-cookie
    # gate) and regressed LL-HLS latency. Bump this deliberately + retest.
    image: bluenviron/mediamtx:1.19.2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      # The scratch-based MediaMTX image ships no CA bundle, so its outbound HTTPS
      # call to the control-plane auth endpoint fails ("x509: certificate signed by
      # unknown authority"). Mount the host CA bundle so Go can verify the cert.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

  caddy:
    # PINNED (not the floating :2 major tag) so the reverse proxy can't drift.
    image: caddy:2.11.4
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
