###############################################################################
# MediaMTX — VoxTranslate webinar ingest (WHIP) → LL-HLS  (F1-0 + F1-2)
#
# Host publishes to  https://ingest.voxtranslate.app/webinar/{code}/whip
# Guests read        https://ingest.voxtranslate.app/webinar/{code}/index.m3u8
#
# Deploy: CI auto-ships this to the Hetzner box (ci.yml `deploy-media`, on every push
# to main that touches infra/). REPLACE_CALLER_SECRET is re-injected ON THE BOX from the
# already-deployed config (or /root/media/.env) — the real value is NEVER committed or
# put in CI. See /DEPLOY-HETZNER.md for the manual fallback.
###############################################################################

# --- WebRTC (WHIP ingest) --------------------------------------------------
# webrtcAdditionalHosts MUST be the grey-cloud (DNS-only) ingest subdomain (or the
# box's public IP). Behind Cloudflare's orange proxy the ICE candidates advertise
# the wrong address and WebRTC never connects (DEPLOY-HETZNER.md §"DNS").
webrtcAdditionalHosts: [ingest.voxtranslate.app]
webrtcLocalUDPAddress: :8189
# WHIP *signaling* is HTTP and Caddy reverse-proxies it from :443, so bind it to
# loopback. The default ":8889" answers the whole internet directly, side-stepping
# the CORS headers Caddy adds and strips. This is ONLY the HTTP port — ICE media
# still needs the public UDP :8189 above, which is a different setting entirely.
webrtcAddress: 127.0.0.1:8889

# --- Protocols this box does not speak ---------------------------------------
# All three default to ENABLED and were found listening on the public interface:
# MoQ on :8892 (TCP/HTTP2 + UDP/HTTP3), RTMP on :1935, SRT on :8890/udp. Hosts
# publish over WHIP and guests read over HLS — nothing here uses any of them, so
# each is only another way in. The firewall blocks them too; this stops them
# listening at all.
moq: no
rtmp: no
srt: no

# --- LL-HLS (participant playback) -----------------------------------------
hls: yes
# Bind to LOOPBACK, not the default ":8888" (all interfaces). Caddy is the only
# thing that should reach MediaMTX. Left on the default, this box answered
# plaintext HLS on :8888 to the entire internet — no TLS, and none of the CORS or
# session-cookie gating that :443 enforces. Verified exposed on 2026-07-27.
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# CORS: MediaMTX defaults hlsAllowOrigin to "*". The guest player fetches HLS with
# credentials (hls.js xhrSetup sets withCredentials=true to carry the hlsSession cookie
# on LL-HLS blocking playlist reloads). Browsers REJECT "Access-Control-Allow-Origin: *"
# together with "Access-Control-Allow-Credentials: true", so every credentialed reload
# is blocked and LL-HLS silently degrades to full-segment latency (~6 s). Pin the guest
# origin so the credentialed requests are valid CORS.
# PLURAL: 1.19.2 still accepts the singular `hlsAllowOrigin` but logs it as deprecated,
# so it will not survive a future image bump.
hlsAllowOrigins: [https://voxtranslate.app]

# --- External auth (F1-2) --------------------------------------------------
# PUBLISH is authorized by the Axum control plane: MediaMTX POSTs each attempt to
# the address below, whose PATH carries the caller secret. read/playback are
# EXCLUDED, so guests pull HLS with no token (the code's entropy is the gate).
#
# NOTE: this points at the DIRECT Railway origin, NOT api.voxtranslate.app. The API
# is behind Cloudflare, whose bot "managed challenge" returns a 403 JS page to this
# headless Go client (which can't solve it) → auth fails. Hitting the origin directly
# bypasses the challenge; `/internal/media-auth/*` is exempt from the server's
# origin-lock for exactly this reason (it's protected by the caller secret + HMAC).
# A valid TLS cert is required — the host CA bundle is mounted in docker-compose.yml.
authMethod: http
authHTTPAddress: https://voxtranslate-server-production.up.railway.app/internal/media-auth/REPLACE_CALLER_SECRET
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

# Control/metrics API off — nothing external needs it, and HTTP auth mode has no
# internal admin user to protect (so there is no admin password to set).
api: no
metrics: no
playback: no

# --- RTSP (read replicas only) ----------------------------------------------
# The RTSP server stays ENABLED and on a public port: it is how read replicas pull
# each webinar (see replica/mediamtx.yml). It cannot bind loopback — the replica is
# a different machine.
#
# It is also UNAUTHENTICATED, because authHTTPExclude above drops the `read` action.
# The Hetzner firewall is therefore the ONLY thing standing between :8554 and anyone
# who wants to read every live webinar. `vox-media-fw` must be ATTACHED to this box
# with 8554/tcp restricted to the replica IPs — a firewall that exists but is
# attached to nothing protects nothing (that was the state on 2026-07-27).
rtsp: yes

paths:
  # Any path under webinar/ is publisher-sourced (the host's WHIP stream).
  ~^webinar/.*$:
    source: publisher
