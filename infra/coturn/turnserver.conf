# coturn (TURN) config for VoxTranslate WebRTC media relay — spec 0026.
# TEMPLATE: validate in your environment before relying on it (TURN networking on
# a PaaS is finicky — read infra/coturn/README.md, especially the external-ip and
# relay-port-range notes).
#
# The VoxTranslate server mints time-limited credentials with the SAME shared
# secret (`static-auth-secret` below == the server's `TURN_SECRET` env var) using
# coturn's REST-API convention, so no per-user accounts live here.

# --- Listeners -------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
# Bind to all interfaces inside the container/VM.
listening-ip=0.0.0.0
relay-ip=0.0.0.0
# CRITICAL on a NAT'd cloud host: advertise the PUBLIC IPv4 so relayed candidates
# are reachable. On Fly.io this is the app's allocated dedicated IPv4.
#   external-ip=<PUBLIC_IPV4>
external-ip=${TURN_EXTERNAL_IP}

# --- Auth (REST API / ephemeral credentials) -------------------------------
use-auth-secret
# Same value as the VoxTranslate server's TURN_SECRET env var.
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}
server-name=${TURN_REALM}

# --- Relay port range ------------------------------------------------------
# Keep it SMALL and make sure every port here is exposed publicly (UDP). A wide
# range is impractical on most PaaS — see the README; turns:/TCP on 5349 (or 443)
# is the pragmatic fallback that needs only one port.
min-port=49160
max-port=49200

# --- TLS (for turns: over TCP) ---------------------------------------------
# Provide a cert for the realm to enable turns:5349 (works through strict
# firewalls). Omit if you terminate TLS in front of coturn.
#   cert=/etc/coturn/fullchain.pem
#   pkey=/etc/coturn/privkey.pem

# --- Hardening -------------------------------------------------------------
fingerprint
no-cli
no-tcp-relay
# Don't relay to private/internal ranges (SSRF protection).
#
# `/api/ice` mints a credential to anonymous callers, so anyone can allocate a
# relay here — which makes this list the boundary between "a TURN server" and "an
# open proxy into our own network". It previously covered RFC1918 only, leaving
# loopback, link-local and the whole of IPv6 reachable. `no-tcp-relay` above
# closed the classic cloud-metadata path over HTTP, but that is an accident of
# another setting rather than this list doing its job.
#
# RFC1918.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# "This host" and loopback — services listening on the TURN box itself.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Link-local. 169.254.169.254 is the cloud metadata service on AWS, GCP, Azure,
# Hetzner and DigitalOcean alike: credentials, one UDP datagram away.
denied-peer-ip=169.254.0.0-169.254.255.255
# Carrier-grade NAT (RFC 6598) — provider-internal on several hosts.
denied-peer-ip=100.64.0.0-100.127.255.255
# IPv6. Omitting these left every private v6 address reachable even while the v4
# equivalents were blocked.
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
#
# NOT denied here, deliberately: the IPv4-mapped range `::ffff:0:0/96`. An
# attacker asking for `::ffff:10.0.0.1` would re-enter RFC1918 through the back
# door, but a dual-stack listener may also represent ordinary IPv4 peers that
# way — in which case denying the range blocks every relay and takes calls down.
# Which of the two happens depends on the coturn build and the listener setup,
# and it has not been tested on this deployment. Verify against the running
# server (allocate a relay and request an `::ffff:10.x` peer) before adding it:
# a hardening line that breaks the product is a worse outcome than the gap.
no-multicast-peers

# --- Abuse quotas (spec 0028) ----------------------------------------------
# /api/ice mints credentials to anonymous callers (guests need TURN), so bound
# the blast radius of a leaked/scraped credential: cap concurrent allocations
# server-wide and per credential, and cap per-session relayed bandwidth. Tune to
# your expected call volume.
total-quota=200
user-quota=6
# Per-allocation bandwidth ceiling in bytes/sec (here ~2 MB/s — generous for one
# call). Set bps-capacity to also cap the server total if your host bills egress.
max-bps=2000000
# bps-capacity=0
stale-nonce=600

# --- Logging ---------------------------------------------------------------
log-file=stdout
simple-log
