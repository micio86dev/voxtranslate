[package]
name = "voxtranslate-server"
version = "1.13.2"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "multipart", "form", "query"] }
futures = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
url = "2"

# Auth + billing
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "macros", "migrate", "json"] }
# Semantic transcript search: binds Postgres `vector(1536)` (pgvector) through sqlx
# so transcript-chunk embeddings round-trip as a typed column.
pgvector = { version = "0.4", features = ["sqlx"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
# hmac/sha2/sha1 are pinned together on the digest-0.11 generation: sha1 0.11
# pulls digest 0.11, and hmac needs to be on the matching generation for
# Hmac::<Sha1> (TURN cred HMAC, api.rs) and Hmac::<Sha256> (Stripe webhook
# signatures, stripe_handler.rs) to compile. Bump all three together.
sha1 = "0.11"
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"

# Translation cache (spec 0107): DragonflyDB is Redis-compatible, reached over the
# async connection manager (auto-reconnect). md5 keys the normalized phrase.
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"] }
md5 = "0.8"

# Transcript PDF export (spec 0009). Exact pins: typst-as-lib tracks typst
# minor versions closely, so we upgrade all three together, deliberately.
chrono-tz = "0.10"
typst = "=0.14.2"
typst-pdf = "=0.14.2"
typst-as-lib = "=0.15.5"

# Chat file upload (spec 0018): extract text from uploaded text-layer PDFs.
pdf-extract = "0.7"
# Chat-file text extraction for .docx (a zip of XML): read word/document.xml and
# pull the <w:t> runs. deflate-only keeps the zip backend lean.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
chacha20poly1305 = "0.10"
rand = "0.10"
web-push = { version = "0.11.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
