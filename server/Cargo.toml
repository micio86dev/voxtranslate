[package]
name = "voxtranslate-server"
version = "1.2.2"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
url = "2"

# Auth + billing
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "macros", "migrate", "json"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
# Pinned to 0.10 (not the 0.11 Dependabot bump): sha1 0.11 pulls digest 0.11,
# but hmac 0.12 is on digest 0.10, so Hmac::<Sha1> (TURN cred HMAC in api.rs)
# stops compiling. Bump only together with a digest-0.11-compatible hmac.
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"

# Translation cache (spec 0107): DragonflyDB is Redis-compatible, reached over the
# async connection manager (auto-reconnect). md5 keys the normalized phrase.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
md5 = "0.8"

# Transcript PDF export (spec 0009). Exact pins: typst-as-lib tracks typst
# minor versions closely, so we upgrade all three together, deliberately.
chrono-tz = "0.10"
typst = "=0.14.2"
typst-pdf = "=0.14.2"
typst-as-lib = "=0.15.5"

# Chat file upload (spec 0018): extract text from uploaded text-layer PDFs.
pdf-extract = "0.7"
# Chat-file text extraction for .docx (a zip of XML): read word/document.xml and
# pull the <w:t> runs. deflate-only keeps the zip backend lean.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
chacha20poly1305 = "0.10"
rand = "0.9"
web-push = { version = "0.11.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
